
name: Extract Shopmmo Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract HTML
        run: |
          unzip -o Shopmmo_BM_Supabase_Connected_Part1.zip -d /tmp/shopmmo
          test -s /tmp/shopmmo/index.html
          cp /tmp/shopmmo/index.html index.html

      - name: Save website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Shopmmo website HTML" || true
          git push
